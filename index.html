        #joystick-stick { position: absolute; width: 55px; height: 55px; background: rgba(56, 189, 248, 0.9); border: 2px solid #ffffff; border-radius: 9999px; pointer-events: none; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 12px rgba(255, 255, 255, 0.6); }

    <!-- Script Principal -->
    <script>
        class SoundEngine {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } }
            playTone(freq, type, duration, vol = 0.1) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e){}
            }
            playHeartbeat(rate = 1) {
                this.init();
                this.playTone(60, 'sine', 0.15, 0.3);
                setTimeout(() => this.playTone(50, 'sine', 0.2, 0.25), 180 / rate);
            }
            playTaskComplete() {
                this.init();
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    setTimeout(() => this.playTone(freq, 'triangle', 0.2, 0.15), idx * 80);
                });
            }
            playKillSound() {
                this.init();
                this.playTone(150, 'sawtooth', 0.3, 0.4);
                this.playTone(80, 'square', 0.4, 0.5);
            }
            playVentSwoosh() {
                this.init();
                this.playTone(200, 'sine', 0.25, 0.2);
            }
            playSabotageAlarm() {
                this.init();
                this.playTone(880, 'sawtooth', 0.15, 0.15);
                setTimeout(() => this.playTone(698, 'sawtooth', 0.15, 0.15), 150);
            }
        }

        const audio = new SoundEngine();

        // Control de Carga Forzada para imágenes pesadas
        let isImageReady = false;
        const mapImage = new Image();
        mapImage.onload = () => {
            isImageReady = true;
        };
        mapImage.src = 'map.png';

        const PRESET_COLORS = [
            '#ff3b30', '#ff9500', '#ffcc00', '#34c759', 
            '#00c7be', '#30b0c7', '#007aff', '#5856d6', 
            '#af52de', '#ff2d55'
        ];

        function getShadowColor(hexColor) {
            if (!hexColor || typeof hexColor !== 'string') return '#000000';
            let hex = hexColor.replace('#', '');
            if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
            if (hex.length !== 6) return '#000000';
            const r = Math.max(0, Math.floor(parseInt(hex.substring(0, 2), 16) * 0.55));
            const g = Math.max(0, Math.floor(parseInt(hex.substring(2, 4), 16) * 0.55));
            const b = Math.max(0, Math.floor(parseInt(hex.substring(4, 6), 16) * 0.55));
            return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
        }

        function getColorObj(colorVal) {
            if (colorVal && typeof colorVal === 'string' && colorVal.startsWith('#')) {
                return { body: colorVal, shadow: getShadowColor(colorVal) };
            }
            return { body: '#007aff', shadow: getShadowColor('#007aff') };
        }

        const HATS = [
            { id: 'none', label: 'NINGUNO', icon: 'fa-minus' },
            { id: 'party', label: 'FIESTA', icon: 'fa-cake-candles' },
            { id: 'crown', label: 'CORONA', icon: 'fa-crown' },
            { id: 'sprout', label: 'BROTE', icon: 'fa-seedling' },
            { id: 'viking', label: 'VIKINGO', icon: 'fa-shield-halved' },
            { id: 'cherry', label: 'CEREZA', icon: 'fa-apple-whole' },
            { id: 'egg', label: 'HUEVO', icon: 'fa-egg' },
            { id: 'banana', label: 'PLÁTANO', icon: 'fa-ban' },
            { id: 'cheese', label: 'QUESO', icon: 'fa-cheese' },
            { id: 'halo', label: 'AUREOLA', icon: 'fa-sun' },
            { id: 'military', label: 'MILITAR', icon: 'fa-hat-cowboy' },
            { id: 'knight', label: 'CABALLERO', icon: 'fa-helmet-safety' },
            { id: 'headphones', label: 'AUDÍFONOS', icon: 'fa-headphones' },
            { id: 'tophat', label: 'GALERA', icon: 'fa-hat-wizard' }
        ];

        let selectedColor = '#007aff';
        let selectedHat = 'cherry';
        let selectedRole = 'crewmate';
        let selectedVentCooldownTime = 5;

        function drawRoundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function drawCrewmateCharacter(ctx, x, y, radius, colorVal, hat, isFacingLeft = false, walkFrame = 0) {
            ctx.save();
            ctx.translate(x, y);
            if (isFacingLeft) ctx.scale(-1, 1);
            const palette = getColorObj(colorVal);

            ctx.fillStyle = palette.shadow;
            drawRoundRect(ctx, -radius * 0.9, -radius * 0.5, radius * 0.4, radius * 0.9, radius * 0.2);
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#000000';
            ctx.stroke();

            const legOffset = Math.sin(walkFrame) * radius * 0.2;
            ctx.fillStyle = palette.shadow;
            drawRoundRect(ctx, -radius * 0.4, radius * 0.3 + legOffset, radius * 0.35, radius * 0.5, radius * 0.15);
            ctx.fill();
            ctx.stroke();
            drawRoundRect(ctx, radius * 0.05, radius * 0.3 - legOffset, radius * 0.35, radius * 0.5, radius * 0.15);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = palette.body;
            drawRoundRect(ctx, -radius * 0.6, -radius * 0.8, radius * 1.2, radius * 1.4, radius * 0.5);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#71d5f4';
            ctx.beginPath();
            ctx.ellipse(radius * 0.15, -radius * 0.25, radius * 0.45, radius * 0.3, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#000000';
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(radius * 0.25, -radius * 0.32, radius * 0.2, radius * 0.1, -Math.PI / 6, 0, Math.PI * 2);
            ctx.fill();

            if (hat === 'party') {
                ctx.fillStyle = '#f43f5e';
                ctx.beginPath();
                ctx.moveTo(-radius * 0.1, -radius * 0.75);
                ctx.lineTo(radius * 0.2, -radius * 1.3);
                ctx.lineTo(radius * 0.4, -radius * 0.75);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            } else if (hat === 'crown') {
                ctx.fillStyle = '#eab308';
                ctx.beginPath();
                ctx.moveTo(-radius * 0.3, -radius * 0.75);
                ctx.lineTo(-radius * 0.3, -radius * 1.1);
                ctx.lineTo(-radius * 0.1, -radius * 0.9);
                ctx.lineTo(0, -radius * 1.2);
                ctx.lineTo(radius * 0.1, -radius * 0.9);
                ctx.lineTo(radius * 0.3, -radius * 1.1);
                ctx.lineTo(radius * 0.3, -radius * 0.75);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            } else if (hat === 'sprout') {
                ctx.strokeStyle = '#22c55e';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, -radius * 0.75);
                ctx.quadraticCurveTo(radius * 0.2, -radius * 1.1, radius * 0.3, -radius * 1.0);
                ctx.stroke();
            } else if (hat === 'cherry') {
                ctx.fillStyle = '#dc2626';
                ctx.beginPath();
                ctx.arc(-radius * 0.1, -radius * 0.9, radius * 0.2, 0, Math.PI * 2);
                ctx.arc(radius * 0.2, -radius * 0.85, radius * 0.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-radius * 0.1, -radius * 0.9);
                ctx.quadraticCurveTo(0, -radius * 1.2, radius * 0.05, -radius * 1.25);
                ctx.stroke();
            }
            ctx.restore();
        }

            isWall(x, y) {
                const col = Math.floor(x / TILE_SIZE);
                const row = Math.floor(y / TILE_SIZE);
                if (row < 0 || row >= MAP_ROWS || col < 0 || col >= MAP_COLS) return true;
                return SKELD_MIRA_MAP_GRID[row][col] === 1;
            }

            getValidTarget(x, y) {
                let col = Math.floor(x / TILE_SIZE);
                let row = Math.floor(y / TILE_SIZE);
                col = Math.max(1, Math.min(MAP_COLS - 2, col));
                row = Math.max(1, Math.min(MAP_ROWS - 2, row));
                if (SKELD_MIRA_MAP_GRID[row] && SKELD_MIRA_MAP_GRID[row][col] === 0) return { x, y };
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (SKELD_MIRA_MAP_GRID[row + dr] && SKELD_MIRA_MAP_GRID[row + dr][col + dc] === 0) {
                            return { x: (col + dc + 0.5) * TILE_SIZE, y: (row + dr + 0.5) * TILE_SIZE };
                        }
                    }
                }
                return { x: 14.5 * TILE_SIZE, y: 2.5 * TILE_SIZE };
            }

            checkCollision(newX, newY) {
                const hitRadius = 14;
                const points = [
                    { x: newX - hitRadius, y: newY - hitRadius },
                    { x: newX + hitRadius, y: newY - hitRadius },
                    { x: newX - hitRadius, y: newY + hitRadius },
                    { x: newX + hitRadius, y: newY + hitRadius }
                ];
                return points.some(p => this.isWall(p.x, p.y));
            }

            isWallBetween(x1, y1, x2, y2) {
                const steps = 10;
                for (let i = 1; i < steps; i++) {
                    const testX = x1 + (x2 - x1) * (i / steps);
                    const testY = y1 + (y2 - y1) * (i / steps);
                    if (this.isWall(testX, testY)) return true;
                }
                return false;
            }

            update() {
                if (!this.gameStarted || !this.player || this.isGameOver || this.isMeetingActive) return;

                if (this.player.killCooldown > 0) this.player.killCooldown -= 1/60;
                if (this.player.ventCooldown > 0) this.player.ventCooldown -= 1/60;

                let dx = 0, dy = 0;
                if (this.keys['KeyW'] || this.keys['ArrowUp'] || this.keys['w'] || this.keys['W']) dy -= 1;
                if (this.keys['KeyS'] || this.keys['ArrowDown'] || this.keys['s'] || this.keys['S']) dy += 1;
                if (this.keys['KeyA'] || this.keys['ArrowLeft'] || this.keys['a'] || this.keys['A']) dx -= 1;
                if (this.keys['KeyD'] || this.keys['ArrowRight'] || this.keys['d'] || this.keys['D']) dx += 1;

                if (this.analogDir.x !== 0 || this.analogDir.y !== 0) {
                    dx = this.analogDir.x;
                    dy = this.analogDir.y;
                }

                if ((dx !== 0 || dy !== 0) && !this.player.inVent && !this.player.isDead) {
                    const len = Math.hypot(dx, dy);
                    const normX = (dx / len) * this.player.speed;
                    const normY = (dy / len) * this.player.speed;

                    if (!this.checkCollision(this.player.x + normX, this.player.y)) this.player.x += normX;
                    if (!this.checkCollision(this.player.x, this.player.y + normY)) this.player.y += normY;

                    if (dx < 0) this.player.isFacingLeft = true;
                    if (dx > 0) this.player.isFacingLeft = false;
                    this.player.walkFrame += 0.25;
                }

                this.updateBots();
                this.checkProximity();
                this.updateActionButtons();
            }

            updateBots() {
                this.bots.forEach(bot => {
                    if (bot.isDead) return;
                    if (bot.role === 'impostor') {
                        if (bot.killCooldown > 0) bot.killCooldown -= 1 / 60;
                        if (bot.unstuckTimer > 0) bot.unstuckTimer--;
                        if (bot.unstuckTimer <= 0) {
                            let targets = [];
                            if (this.player.role === 'crewmate' && !this.player.inVent && !this.player.isDead) {
                                targets.push({ isPlayer: true, botRef: null, x: this.player.x, y: this.player.y, dist: Math.hypot(this.player.x - bot.x, this.player.y - bot.y) });
                            }
                            this.bots.forEach(b => {
                                if (b.role === 'crewmate' && !b.isDead) {
                                    targets.push({ isPlayer: false, botRef: b, x: b.x, y: b.y, dist: Math.hypot(b.x - bot.x, b.y - bot.y) });
                                }
                            });
                            targets = targets.filter(t => t.dist < 350 && !this.isWallBetween(bot.x, bot.y, t.x, t.y));
                            targets.sort((a, b) => a.dist - b.dist);

                            if (targets.length > 0 && bot.killCooldown <= 0 && Math.random() < 0.25) {
                                const chosen = targets[0];
                                const validTgt = this.getValidTarget(chosen.x, chosen.y);
                                bot.targetX = validTgt.x;
                                bot.targetY = validTgt.y;
                                if (chosen.dist < 42) {
                                    audio.playKillSound();
                                    bot.killCooldown = 18;
                                    if (chosen.isPlayer) {
                                        this.player.isDead = true;
                                        this.deadBodies.push({ id: 'player', x: this.player.x, y: this.player.y, color: this.player.color, name: 'Tú' });
                                        this.triggerGameOver(false, "¡El Impostor te eliminó!");
                                        return;
                                    } else {
                                        chosen.botRef.isDead = true;
                                        this.deadBodies.push({ id: chosen.botRef.id, x: chosen.botRef.x, y: chosen.botRef.y, color: chosen.botRef.color, name: chosen.botRef.name });
                                    }
                                }
                            } else {
                                if (!bot.targetX || Math.hypot(bot.targetX - bot.x, bot.targetY - bot.y) < 30) {
                                    const randTask = SKELD_TASKS[Math.floor(Math.random() * SKELD_TASKS.length)];
                                    const validTgt = this.getValidTarget(randTask.x, randTask.y);
                                    bot.targetX = validTgt.x;
                                    bot.targetY = validTgt.y;
                                }
                            }
                        }
                    } else {
                        const impostorRef = this.player.role === 'impostor' ? this.player : this.bots.find(b => b.role === 'impostor');
                        const isImpostorVisible = impostorRef && !impostorRef.inVent && !impostorRef.isDead && Math.hypot(impostorRef.x - bot.x, impostorRef.y - bot.y) < 160;

                        if (isImpostorVisible) {
                            bot.isPanicking = true;
                            bot.panicTimer = 60;
                            const escapeAngle = Math.atan2(bot.y - impostorRef.y, bot.x - impostorRef.x);
                            const validTgt = this.getValidTarget(bot.x + Math.cos(escapeAngle) * 100, bot.y + Math.sin(escapeAngle) * 100);
                            bot.targetX = validTgt.x;
                            bot.targetY = validTgt.y;
                        } else if (bot.panicTimer > 0) {
                            bot.panicTimer--;
                            if (bot.panicTimer <= 0) bot.isPanicking = false;
                        }

                        if (this.isSabotageActive) {
                            bot.isPanicking = false;
                            bot.targetX = REACTOR_SABOTAGE_POS.x;
                            bot.targetY = REACTOR_SABOTAGE_POS.y;
                            if (Math.hypot(bot.x - REACTOR_SABOTAGE_POS.x, bot.y - REACTOR_SABOTAGE_POS.y) < 40) {
                                bot.workingTimer = (bot.workingTimer || 0) + 1/60;
                                if (bot.workingTimer >= 3.0) {
                                    this.resolveSabotage("¡Un tripulante reparó la crisis!");
                                    bot.workingTimer = 0;
                                }
                            }
                        } else if (!bot.isPanicking) {
                            if (!bot.currentTask || bot.currentTask.completed) {
                                const uncompleted = this.tasks.filter(t => !t.completed);
                                if (uncompleted.length > 0) {
                                    bot.currentTask = uncompleted[Math.floor(Math.random() * uncompleted.length)];
                                    const validTgt = this.getValidTarget(bot.currentTask.x, bot.currentTask.y);
                                    bot.targetX = validTgt.x;
                                    bot.targetY = validTgt.y;
                                    bot.workingTimer = 0;
                                }
                            }
                            if (bot.currentTask && Math.hypot(bot.targetX - bot.x, bot.targetY - bot.y) < 30) {
                                bot.workingTimer += 1/60;
                                if (bot.workingTimer >= 3.5) {
                                    this.completeTask(bot.currentTask.id);
                                    bot.workingTimer = 0;
                                    bot.currentTask = null;
                                }
                            }
                        }
                    }

                    const currentSpeed = bot.isPanicking ? bot.speed * 1.3 : bot.speed;
                    const bdx = bot.targetX - bot.x;
                    const bdy = bot.targetY - bot.y;
                    const dist = Math.hypot(bdx, bdy);
                    if (dist > 3) {
                        const vx = (bdx / dist) * currentSpeed;
                        const vy = (bdy / dist) * currentSpeed;
                        let movedX = false, movedY = false;
                        if (!this.checkCollision(bot.x + vx, bot.y)) { bot.x += vx; movedX = true; }
                        if (!this.checkCollision(bot.x, bot.y + vy)) { bot.y += vy; movedY = true; }
                        if (!movedX && !movedY) {
                            bot.stuckFrames = (bot.stuckFrames || 0) + 1;
                            if (bot.stuckFrames > 8) {
                                const randTask = SKELD_TASKS[Math.floor(Math.random() * SKELD_TASKS.length)];
                                const validTgt = this.getValidTarget(randTask.x, randTask.y);
                                bot.targetX = validTgt.x;
                                bot.targetY = validTgt.y;
                                bot.stuckFrames = 0;
                                bot.unstuckTimer = 120;
                            }
                        } else {
                            bot.stuckFrames = 0;
                        }
                        bot.isFacingLeft = bdx < 0;
                        bot.walkFrame += 0.25;
                    }
                });
            }

            checkProximity() {
                const impostor = this.player.role === 'impostor' ? this.player : this.bots.find(b => b.role === 'impostor');
                if (!impostor || impostor.isDead) return;
                const dist = Math.hypot(this.player.x - impostor.x, this.player.y - impostor.y);
                const proxText = document.getElementById('proximity-text');
                const heartIcon = document.getElementById('heart-icon');
                this.heartbeatTimer++;

                if (dist < 160) {
                    proxText.innerText = "¡PELIGRO!";
                    proxText.className = "font-orbitron text-[10px] sm:text-xs font-semibold text-red-500 animate-pulse";
                    heartIcon.className = "fa-solid fa-heart text-red-500 text-xl sm:text-2xl scale-125 transition-all";
                    if (this.heartbeatTimer % 20 === 0) audio.playHeartbeat(2);
                } else if (dist < 320) {
                    proxText.innerText = "ALERTA";
                    proxText.className = "font-orbitron text-[10px] sm:text-xs font-semibold text-amber-400";
                    heartIcon.className = "fa-solid fa-heart text-amber-400 text-base sm:text-xl transition-all";
                    if (this.heartbeatTimer % 45 === 0) audio.playHeartbeat(1);
                } else {
                    proxText.innerText = "SEGURO";
                    proxText.className = "font-orbitron text-[10px] sm:text-xs font-semibold text-slate-300";
                    heartIcon.className = "fa-solid fa-heart text-emerald-400 text-sm sm:text-lg transition-all";
                }
            }

            render() {
                if (!this.gameStarted || !this.player) return;
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                const cameraX = this.canvas.width / 2 - this.player.x;
                const cameraY = this.canvas.height / 2 - this.player.y;

                this.ctx.save();
                this.ctx.translate(cameraX, cameraY);
                this.ctx.lineJoin = 'round';

                const rows = SKELD_MIRA_MAP_GRID.length;
                const cols = SKELD_MIRA_MAP_GRID[0].length;
                const totalW = cols * TILE_SIZE;
                const totalH = rows * TILE_SIZE;

                // Dibujar imagen del mapa cuando la variable isImageReady sea verdadera
                if (isImageReady || (mapImage.complete && mapImage.naturalWidth > 0)) {
                    this.ctx.drawImage(mapImage, 0, 0, totalW, totalH);
                } else {
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            const x = c * TILE_SIZE;
                            const y = r * TILE_SIZE;
                            if (SKELD_MIRA_MAP_GRID[r][c] === 1) {
                                this.ctx.fillStyle = '#0f172a';
                                this.ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                            } else {
                                this.ctx.fillStyle = '#1e293b';
                                this.ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                            }
                        }
                    }
                }

                SKELD_VENTS.forEach(v => {
                    this.ctx.fillStyle = '#334155';
                    this.ctx.fillRect(v.x - 22, v.y - 16, 44, 32);
                    this.ctx.strokeStyle = '#64748b';
                    this.ctx.lineWidth = 3;
                    this.ctx.strokeRect(v.x - 22, v.y - 16, 44, 32);
                });

                this.tasks.forEach(t => {
                    this.ctx.fillStyle = t.completed ? '#10b981' : '#f59e0b';
                    this.ctx.beginPath();
                    this.ctx.arc(t.x, t.y, 16, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.strokeStyle = '#ffffff';
                    this.ctx.lineWidth = 2;
                    this.ctx.stroke();
                });

                this.deadBodies.forEach(body => {
                    drawDeadBody(this.ctx, body.x, body.y, body.color);
                });

                this.bots.forEach(bot => {
                    if (!bot.isDead) {
                        drawCrewmateCharacter(this.ctx, bot.x, bot.y, bot.radius, bot.color, bot.hat, bot.isFacingLeft, bot.walkFrame);
                    }
                });

                if (!this.player.inVent && !this.player.isDead) {
                    drawCrewmateCharacter(this.ctx, this.player.x, this.player.y, this.player.radius, this.player.color, this.player.hat, this.player.isFacingLeft, this.player.walkFrame);
                }

                this.renderFogOfWar();
                this.ctx.restore();
            }

            renderFogOfWar() {
                if (!this.player) return;
                const viewRadius = this.player.role === 'impostor' ? 320 : 240;
                this.ctx.save();
                this.ctx.beginPath();
                this.ctx.rect(this.player.x - this.canvas.width, this.player.y - this.canvas.height, this.canvas.width * 2, this.canvas.height * 2);
                this.ctx.arc(this.player.x, this.player.y, viewRadius, 0, Math.PI * 2, true);
                this.ctx.fillStyle = 'rgba(3, 7, 18, 0.85)';
                this.ctx.fill();
                this.ctx.restore();
            }

            updateActionButtons() {
                const actionBtn = document.getElementById('action-btn');
                const actionText = document.getElementById('action-text');
                const actionIcon = document.getElementById('action-icon');
                const ventBtn = document.getElementById('vent-btn');
                const sabotageBtn = document.getElementById('sabotage-btn');
                const reportBtn = document.getElementById('report-btn');

                const nearbyBody = this.deadBodies.find(b => Math.hypot(b.x - this.player.x, b.y - this.player.y) < 70);
                if (nearbyBody && !this.player.isDead) reportBtn.classList.remove('hidden');
                else reportBtn.classList.add('hidden');

                if (this.player.role === 'impostor') {
                    ventBtn.classList.remove('hidden');
                    sabotageBtn.classList.remove('hidden');
                    if (this.player.inVent) {
                        actionText.innerText = "SALIR";
                        actionIcon.className = "fa-solid fa-door-open text-xl mb-0.5";
                    } else {
                        const targetBot = this.bots.find(b => !b.isDead && Math.hypot(b.x - this.player.x, b.y - this.player.y) < 50);
                        if (targetBot && this.player.killCooldown <= 0) {
                            actionText.innerText = "ASESINAR";
                            actionIcon.className = "fa-solid fa-skull text-xl mb-0.5";
                        } else {
                            actionText.innerText = this.player.killCooldown > 0 ? `${Math.ceil(this.player.killCooldown)}s` : "BUSCAR";
                            actionIcon.className = "fa-solid fa-hourglass-half text-xl mb-0.5";
                        }
                    }
                } else {
                    ventBtn.classList.add('hidden');
                    sabotageBtn.classList.add('hidden');
                    const nearbyTask = this.tasks.find(t => !t.completed && Math.hypot(t.x - this.player.x, t.y - this.player.y) < 55);
                    actionText.innerText = "USAR";
                    actionIcon.className = nearbyTask ? "fa-solid fa-hand text-xl mb-0.5" : "fa-solid fa-screwdriver-wrench text-xl mb-0.5";
                }
            }

            handlePrimaryAction() {
                if (this.player.role === 'impostor') {
                    if (this.player.inVent) { this.exitVent(); return; }
                    const targetBot = this.bots.find(b => !b.isDead && Math.hypot(b.x - this.player.x, b.y - this.player.y) < 50);
                    if (targetBot && this.player.killCooldown <= 0) {
                        targetBot.isDead = true;
                        this.deadBodies.push({ id: targetBot.id, x: targetBot.x, y: targetBot.y, color: targetBot.color, name: targetBot.name });
                        this.player.killCooldown = 18;
                        audio.playKillSound();
                    }
                } else {
                    const nearbyTask = this.tasks.find(t => !t.completed && Math.hypot(t.x - this.player.x, t.y - this.player.y) < 55);
                    if (nearbyTask) openMinigameModal(nearbyTask);
                }
            }

            reportDeadBody() {
                const nearbyBody = this.deadBodies.find(b => Math.hypot(b.x - this.player.x, b.y - this.player.y) < 70);
                if (nearbyBody) this.startEmergencyMeeting('Tú', nearbyBody.name);
            }

            startEmergencyMeeting(reporterName, victimName) {
                if (this.isMeetingActive) return;
                this.isMeetingActive = true;
                audio.playSabotageAlarm();
                document.getElementById('meeting-modal').classList.remove('hidden');
                document.getElementById('meeting-subtitle').innerText = `${reporterName} encontró un cuerpo. ¡A debatir!`;
                
                const votersGrid = document.getElementById('voters-grid');
                votersGrid.innerHTML = '';
                const allParticipants = [
                    { id: 'player', name: 'Tú', color: this.player.color, isDead: this.player.isDead, role: this.player.role },
                    ...this.bots.map(b => ({ id: b.id, name: b.name, color: b.color, isDead: b.isDead, role: b.role }))
                ];

                allParticipants.forEach(p => {
                    const card = document.createElement('div');
                    card.className = `p-2.5 rounded-2xl border-2 flex items-center justify-between ${p.isDead ? 'opacity-50 bg-slate-900' : 'bg-slate-800'}`;
                    const palette = getColorObj(p.color);
                    card.innerHTML = `
                        <div class="flex items-center gap-2.5">
                            <div class="w-7 h-7 rounded-full border-2 border-black" style="background-color: ${palette.body}"></div>
                            <span class="font-orbitron font-bold text-xs ${p.isDead ? 'line-through text-slate-500' : 'text-white'}">${p.name}</span>
                        </div>
                        ${p.isDead ? '<span class="text-red-500 text-xs font-bold">MUERTO</span>' : `<button onclick="castPlayerVote('${p.id}')" class="px-2.5 py-1 bg-cyan-600 text-white rounded-lg text-xs font-orbitron font-bold">VOTAR</button>`}
                    `;
                    votersGrid.appendChild(card);
                });

                let voteTimer = 15;
                const timerSpan = document.getElementById('voting-timer');
                this.votingInterval = setInterval(() => {
                    voteTimer--;
                    timerSpan.innerText = `Tiempo: ${voteTimer}s`;
                    if (voteTimer <= 0) { clearInterval(this.votingInterval); this.processVotingResults('skip'); }
                }, 1000);

                window.castPlayerVote = (id) => { clearInterval(this.votingInterval); this.processVotingResults(id); };
                document.getElementById('skip-vote-btn').onclick = () => { clearInterval(this.votingInterval); this.processVotingResults('skip'); };
            }

            processVotingResults(targetId) {
                document.getElementById('meeting-modal').classList.add('hidden');
                this.showEjectionScreen(null, "Nadie fue expulsado.");
            }

            showEjectionScreen(ejected, message) {
                const ejectionModal = document.getElementById('ejection-modal');
                document.getElementById('ejection-result-text').innerText = message;
                ejectionModal.classList.remove('hidden');
                document.getElementById('continue-after-vote-btn').classList.remove('hidden');
                document.getElementById('continue-after-vote-btn').onclick = () => {
                    ejectionModal.classList.add('hidden');
                    this.isMeetingActive = false;
                    this.deadBodies = [];
                };
            }

            useVent() {
                if (this.player.role !== 'impostor' || this.player.ventCooldown > 0) return;
                audio.playVentSwoosh();
                this.player.inVent = !this.player.inVent;
            }
            exitVent() {
                this.player.inVent = false;
                this.player.ventCooldown = selectedVentCooldownTime;
                audio.playVentSwoosh();
            }
            triggerSabotage() {
                if (this.isSabotageActive) return;
                this.isSabotageActive = true;
                document.getElementById('sabotage-alert').classList.remove('hidden');
                audio.playSabotageAlarm();
            }
            resolveSabotage(msg) {
                this.isSabotageActive = false;
                document.getElementById('sabotage-alert').classList.add('hidden');
                audio.playTaskComplete();
            }
            completeTask(id) {
                const t = this.tasks.find(tsk => tsk.id === id);
                if (t) { t.completed = true; audio.playTaskComplete(); this.updateHUD(); }
            }
            updateHUD() {
                const comp = this.tasks.filter(t => t.completed).length;
                document.getElementById('task-count-text').innerText = `${comp} / ${this.tasks.length}`;
                document.getElementById('task-progress-fill').style.width = `${(comp / this.tasks.length) * 100}%`;
            }
            triggerGameOver(win, msg) {
                this.isGameOver = true;
                document.getElementById('game-over-modal').classList.remove('hidden');
                document.getElementById('game-over-title').innerText = win ? "¡VICTORIA!" : "DERROTA";
                document.getElementById('game-over-desc').innerText = msg;
            }
        }

        function openMinigameModal(task) {
            const modal = document.getElementById('minigame-modal');
            document.getElementById('minigame-title').innerText = `TAREA: ${task.name}`;
            const container = document.getElementById('minigame-container');
            container.innerHTML = `
                <div class="flex flex-col items-center gap-4 w-52">
                    <div class="w-full bg-slate-800 h-5 rounded-full overflow-hidden border border-slate-700">
                        <div id="download-progress" class="bg-cyan-400 h-full w-0%"></div>
                    </div>
                    <button id="download-btn" class="px-6 py-2 bg-emerald-500 text-slate-950 font-orbitron font-bold text-xs rounded-xl">COMPLETAR</button>
                </div>
            `;
            modal.classList.remove('hidden');
            document.getElementById('download-btn').onclick = () => {
                game.completeTask(task.id);
                modal.classList.add('hidden');
            };
        }

        let game = null;

        function setupMenuControls() {
            const colorContainer = document.getElementById('color-selector');
            colorContainer.innerHTML = '';
            PRESET_COLORS.forEach(hex => {
                const btn = document.createElement('button');
                btn.className = `w-6 h-6 rounded-full border-2 ${selectedColor === hex ? 'scale-125 border-white ring-2 ring-cyan-400' : 'border-transparent'}`;
                btn.style.backgroundColor = hex;
                btn.onclick = () => { selectedColor = hex; setupMenuControls(); renderPreview(); };
                colorContainer.appendChild(btn);
            });

            const hatContainer = document.getElementById('hat-selector');
            hatContainer.innerHTML = '';
            HATS.forEach(hat => {
                const btn = document.createElement('button');
                btn.className = `among-btn p-1.5 rounded-xl border-2 text-[9px] font-orbitron font-bold flex flex-col items-center justify-center gap-1 ${selectedHat === hat.id ? 'border-cyan-400 bg-cyan-950 text-cyan-200' : 'border-slate-700 bg-slate-800 text-slate-400'}`;
                btn.innerHTML = `<i class="fa-solid ${hat.icon} text-xs"></i><span>${hat.label}</span>`;
                btn.onclick = () => { selectedHat = hat.id; setupMenuControls(); renderPreview(); };
                hatContainer.appendChild(btn);
            });

            document.getElementById('role-crewmate-btn').onclick = () => { selectedRole = 'crewmate'; setupMenuControls(); };
            document.getElementById('role-impostor-btn').onclick = () => { selectedRole = 'impostor'; setupMenuControls(); };
            document.getElementById('vent-time-5').onclick = () => { selectedVentCooldownTime = 5; setupMenuControls(); };
            document.getElementById('vent-time-10').onclick = () => { selectedVentCooldownTime = 10; setupMenuControls(); };
        }

        function setupAnalogJoystick() {
            const zone = document.getElementById('joystick-zone');
            const base = document.getElementById('joystick-base');
            const stick = document.getElementById('joystick-stick');
            let activeId = null, startX = 0, startY = 0;

            const handleStart = (e) => {
                if (activeId !== null) return;
                const t = e.changedTouches ? e.changedTouches[0] : e;
                activeId = t.identifier !== undefined ? t.identifier : 'mouse';
                startX = t.clientX; startY = t.clientY;
                base.style.left = `${startX}px`; base.style.top = `${startY}px`;
                base.style.display = 'block';
            };
            const handleMove = (e) => {
                if (activeId === null) return;
                let t = null;
                if (e.changedTouches) {
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === activeId) { t = e.changedTouches[i]; break; }
                    }
                } else { t = e; }
                if (!t) return;
                const dx = t.clientX - startX, dy = t.clientY - startY;
                const dist = Math.hypot(dx, dy), angle = Math.atan2(dy, dx), move = Math.min(dist, 45);
                stick.style.transform = `translate(calc(-50% + ${Math.cos(angle)*move}px), calc(-50% + ${Math.sin(angle)*move}px))`;
                if (game) { game.analogDir.x = Math.cos(angle)*(move/45); game.analogDir.y = Math.sin(angle)*(move/45); }
            };
            const handleEnd = () => {
                activeId = null; base.style.display = 'none';
                if (game) game.analogDir = { x: 0, y: 0 };
            };

            zone.addEventListener('touchstart', handleStart);
            zone.addEventListener('touchmove', handleMove);
            zone.addEventListener('touchend', handleEnd);
            zone.addEventListener('mousedown', handleStart);
            window.addEventListener('mousemove', handleMove);
            window.addEventListener('mouseup', handleEnd);
        }

        window.onload = () => {
            setupMenuControls();
            renderPreview();
            game = new GameEngine();

            window.addEventListener('keydown', (e) => {
                game.keys[e.code] = true;
                game.keys[e.key] = true;
                if (e.code === 'Space' || e.code === 'KeyE') game.handlePrimaryAction();
                if (e.code === 'KeyR') game.reportDeadBody();
                if (e.code === 'KeyV') game.useVent();
            });
            window.addEventListener('keyup', (e) => {
                game.keys[e.code] = false;
                game.keys[e.key] = false;
            });

            document.getElementById('action-btn').onclick = () => game.handlePrimaryAction();
            document.getElementById('report-btn').onclick = () => game.reportDeadBody();
            document.getElementById('vent-btn').onclick = () => game.useVent();
            document.getElementById('sabotage-btn').onclick = () => game.triggerSabotage();
            document.getElementById('close-minigame-btn').onclick = () => document.getElementById('minigame-modal').classList.add('hidden');
            document.getElementById('restart-btn').onclick = () => {
                game.gameStarted = false;
                document.getElementById('game-over-modal').classList.add('hidden');
                document.getElementById('main-menu').classList.remove('hidden');
                document.getElementById('hud').classList.add('hidden');
                document.getElementById('action-controls').classList.add('hidden');
                document.getElementById('joystick-zone').classList.add('hidden');
            };
            document.getElementById('start-game-btn').onclick = () => {
                audio.init();
                document.getElementById('main-menu').classList.add('hidden');
                document.getElementById('hud').classList.remove('hidden');
                document.getElementById('action-controls').classList.remove('hidden');
                document.getElementById('joystick-zone').classList.remove('hidden');
                game.init();
            };

            setupAnalogJoystick();

            function loop() {
                game.update();
                game.render();
                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        };
    </script>
</body>
